<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#03191c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#00fff2" stroke-opacity="0.30" stroke-width="1"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="#00fff2" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="200" cy="200" r="90"  fill="none" stroke="#00fff2" stroke-opacity="0.20" stroke-width="1"/>
  <circle cx="200" cy="200" r="45"  fill="none" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="20"  y1="200" x2="380" y2="200" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="200" y1="20"  x2="200" y2="380" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>

  <g>
    <path d="M200,200 L200,20 A180,180 0 0,1 356,110 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="264" cy="142" r="4" fill="#00fff2">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="262" r="3.5" fill="#00fff2">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="232" cy="288" r="3" fill="#00fff2">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="118" cy="152" r="2.5" fill="#00fff2">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="3" fill="#ffffff"/>

  <text x="200" y="205" fill="#00fff2" font-family="monospace" font-size="13"
    text-anchor="middle" letter-spacing="2">SCANNING</text>
</svg>
