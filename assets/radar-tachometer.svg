<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgL" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#03191c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="bgR" cx="70%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#03191c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gaugeArc" x1="500" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#00fff2"/>
      <stop offset="65%" stop-color="#00fff2"/>
      <stop offset="85%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff3b5c"/>
    </linearGradient>
  </defs>

  <!-- unified background so the two devices read as one panel -->
  <rect width="900" height="400" fill="url(#bgL)"/>
  <rect x="450" width="450" height="400" fill="url(#bgR)"/>
  <line x1="450" y1="20" x2="450" y2="380" stroke="#00fff2" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ============ LEFT: RADAR ============ -->
  <g>
    <circle cx="200" cy="200" r="180" fill="none" stroke="#00fff2" stroke-opacity="0.30" stroke-width="1"/>
    <circle cx="200" cy="200" r="135" fill="none" stroke="#00fff2" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="200" cy="200" r="90"  fill="none" stroke="#00fff2" stroke-opacity="0.20" stroke-width="1"/>
    <circle cx="200" cy="200" r="45"  fill="none" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="20"  y1="200" x2="380" y2="200" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>
    <line x1="200" y1="20"  x2="200" y2="380" stroke="#00fff2" stroke-opacity="0.15" stroke-width="1"/>

    <path d="M200,200 L200,20 A180,180 0 0,1 356,110 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
    </path>

    <circle cx="264" cy="142" r="4" fill="#00fff2">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="262" r="3.5" fill="#00fff2">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="232" cy="288" r="3" fill="#00fff2">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="118" cy="152" r="2.5" fill="#00fff2">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="3" fill="#ffffff"/>

    <text x="200" y="205" fill="#00fff2" font-family="monospace" font-size="13"
      text-anchor="middle" letter-spacing="2">SCANNING</text>
  </g>

  <!-- ============ RIGHT: TACHOMETER ============ -->
  <g>
    <circle cx="650" cy="200" r="165" fill="none" stroke="#00fff2" stroke-opacity="0.12" stroke-width="1"/>

    <!-- gauge arc, 270 degree sweep with redline zone -->
    <path d="M543.93,306.07 A150,150 0 1,1 756.07,306.07"
      fill="none" stroke="url(#gaugeArc)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- tick marks -->
    <g stroke="#00fff2" stroke-width="2">
      <line x1="543.93" y1="306.07" x2="558.0" y2="292.0" stroke-opacity="0.6"/>
      <line x1="505.11" y1="238.82" x2="524.43" y2="233.64" stroke-opacity="0.45"/>
      <line x1="505.11" y1="161.18" x2="524.43" y2="166.36" stroke-opacity="0.6"/>
      <line x1="543.93" y1="93.93"  x2="558.0"  y2="108.0"  stroke-opacity="0.45"/>
      <line x1="611.18" y1="55.11"  x2="616.36" y2="74.43"  stroke-opacity="0.6"/>
      <line x1="688.82" y1="55.11"  x2="683.64" y2="74.43"  stroke-opacity="0.6"/>
      <line x1="756.07" y1="93.93"  x2="742.0"  y2="108.0"  stroke-opacity="0.45"/>
      <line x1="794.89" y1="161.18" x2="775.57" y2="166.36" stroke-opacity="0.6" stroke="#ffb347"/>
      <line x1="794.89" y1="238.82" x2="775.57" y2="233.64" stroke-opacity="0.7" stroke="#ff3b5c"/>
      <line x1="756.07" y1="306.07" x2="742.0"  y2="292.0"  stroke-opacity="0.8" stroke="#ff3b5c"/>
    </g>

    <!-- needle, swings across the gauge like a live reading -->
    <g>
      <line x1="650" y1="200" x2="650" y2="65" stroke="#00fff2" stroke-width="3" stroke-linecap="round"/>
      <line x1="650" y1="200" x2="650" y2="230" stroke="#00fff2" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-135 650 200; 135 650 200; 40 650 200; 135 650 200; -135 650 200"
        keyTimes="0; 0.4; 0.55; 0.7; 1"
        dur="6s" repeatCount="indefinite"/>
    </g>
    <circle cx="650" cy="200" r="9" fill="#050505" stroke="#00fff2" stroke-width="2"/>

    <text x="650" y="258" fill="#00fff2" font-family="monospace" font-size="12"
      text-anchor="middle" letter-spacing="2">COMMIT RATE</text>

    <!-- small LED activity strip -->
    <g>
      <circle cx="618" cy="280" r="4" fill="#00fff2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="634" cy="280" r="4" fill="#00fff2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="280" r="4" fill="#00fff2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="666" cy="280" r="4" fill="#ffb347">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="682" cy="280" r="4" fill="#ff3b5c">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
